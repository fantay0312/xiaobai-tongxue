<!doctype html>
<html lang="zh-CN" data-theme="paper">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('xiaobai-ui-theme-v1');
          if (!raw) return;
          var parsed = JSON.parse(raw);
          var theme = parsed && parsed.state && parsed.state.theme;
          var tone = parsed && parsed.state && parsed.state.tone;
          if (theme === 'anime' || theme === 'paper' || theme === 'tech') {
            document.documentElement.dataset.theme = theme;
          }
          if (theme === 'anime' && (tone === 'day' || tone === 'night')) {
            document.documentElement.dataset.tone = tone;
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%favicon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f0f7fa" />
    <meta
      name="description"
      content="小白同学 —— 基于费曼学习法的反转式学习智能体:你来讲,AI 学生来问。教然后知困。"
    />
    <!-- 首屏立即出现的小白精灵图集:预载让首次绘制不必等 JS 求值后再发图片请求(备课教练小砚图集为 prep 专用,不预载) -->
    <link rel="preload" as="image" type="image/webp" href="%BASE_URL%xiaobai-book-boy-atlas.webp" />
    <title>小白同学 · 教然后知困</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
