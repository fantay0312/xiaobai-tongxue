server {
    listen 80;
    listen [::]:80;
    server_name xiaobai.tokentosea.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name xiaobai.tokentosea.com;

    ssl_certificate /etc/letsencrypt/live/xiaobai.tokentosea.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xiaobai.tokentosea.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    # 自定义讲义单文件上限 80 MiB；网关仍逐端点做魔数、类型、并发和精确字节上限校验。
    client_max_body_size 82m;
    client_body_timeout 120s;

    location / {
        if ($http_x_xiaobai_cdn_origin != "__XIAOBAI_CDN_ORIGIN_TOKEN__") {
            return 403;
        }

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # Do not promote a viewer-supplied header into the application's trusted
        # client IP. The CDN origin token restricts access, but does not authenticate
        # X-Xiaobai-Client-IP independently.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        proxy_buffering     off;
    }
}
